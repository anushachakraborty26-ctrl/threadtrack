# Project configuration — currently just ruff lint settings.
# The runtime stack and pinned dependencies live in requirements.txt.

[tool.ruff]
line-length = 100
target-version = "py311"
# Don't lint data, generated outputs, notebooks, or Node modules.
exclude = [
    "data",
    "output",
    "notebooks",
    "docs/process_doc/node_modules",
]

[tool.ruff.lint]
# Rule families enabled:
#   E  pycodestyle errors
#   F  pyflakes        — unused imports, undefined names (the real bug-catching net)
#   W  pycodestyle warnings
#   I  isort           — import order
#   B  flake8-bugbear  — likely-bug patterns
select = ["E", "F", "W", "I", "B"]
# E501 (line too long) is intentionally off — config.py uses wide,
# inline-commented dicts that read worse when wrapped. Line length is the
# most controversial pycodestyle rule and the codebase chooses readability.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
